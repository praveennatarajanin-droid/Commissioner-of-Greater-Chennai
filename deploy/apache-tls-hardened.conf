# ==============================================================================
# GREATER CHENNAI POLICE COMMISSIONER PORTAL ("CHENNAI GUARDIAN")
# APACHE HTTP SERVER HARDENED TLS VIRTUALHOST CONFIGURATION
#
# Remediates:
# - POC-07: Deprecated TLS Version Identified (Disables TLS 1.0 & TLS 1.1)
# - POC-08 / POC-09 / POC-11: Cryptographic Failures & Obsolete CBC Ciphers
# ==============================================================================

<VirtualHost *:80>
    ServerName chennaiguardian.mccmrfip.in
    ServerAlias chennaiguardian.in www.chennaiguardian.in
    
    # Hide Apache Server Tokens
    ServerSignature Off
    
    # Force 301 Redirect from HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName chennaiguardian.mccmrfip.in
    ServerAlias chennaiguardian.in www.chennaiguardian.in
    
    # Hide Apache Server Tokens
    ServerSignature Off
    
    # SSL/TLS Engine
    SSLEngine on
    
    # ── TLS PROTOCOL HARDENING (POC-07) ──
    # Explicitly permit ONLY TLS 1.2 and TLS 1.3. Disallow TLS 1.0, TLS 1.1, SSLv2, SSLv3.
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    
    # ── CIPHER SUITE HARDENING (POC-08, POC-09, POC-11) ──
    # Restrict to modern AEAD ciphers; Exclude CBC, 3DES, RC4, MD5
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    
    # SSL Certificates
    SSLCertificateFile /etc/letsencrypt/live/chennaiguardian.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/chennaiguardian.in/privkey.pem
    SSLCACertificateFile /etc/letsencrypt/live/chennaiguardian.in/chain.pem
    
    # ── OCSP STAPLING ──
    SSLUseStapling on
    SSLStaplingResponderTimeout 5
    SSLStaplingReturnResponderErrors off
    
    # ── SECURITY HEADERS ──
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(self)"
    Header always unset X-Powered-By
    Header always unset Server
    
    # Reverse Proxy to Next.js Application
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
