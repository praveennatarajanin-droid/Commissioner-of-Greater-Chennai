# ==============================================================================
# GREATER CHENNAI POLICE COMMISSIONER PORTAL ("CHENNAI GUARDIAN")
# PRODUCTION REVERSE PROXY & HARDENED TLS CONFIGURATION
#
# Remediates:
# - POC-07: Deprecated TLS Version Identified (Disables TLS 1.0 & TLS 1.1)
# - POC-08: BEAST Attack Vulnerability (Disables TLS 1.0 CBC)
# - POC-09: Lucky13 Timing Attack Vulnerability (Disables Legacy CBC Cipher Suites)
# - POC-10: Content-Security-Policy Enforcement
# - POC-11: Obsolete CBC Ciphers Enabled (Restricts to modern AEAD suites)
# - POC-12: Cleartext Password Transmission (Forces HTTP -> HTTPS redirect & HSTS)
# - POC-14: Server Technology Disclosure (Hides Server and X-Powered-By tokens)
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=gcp_auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=gcp_email_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=gcp_general_limit:10m rate=30r/s;

# 1. HTTP Server - Strict Redirection to HTTPS (POC-12)
server {
    listen 80;
    listen [::]:80;
    server_name chennaiguardian.in www.chennaiguardian.in;

    # Remove server banner
    server_tokens off;

    # Certbot / ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS with 301 Permanent Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Hardened TLS 1.2 / TLS 1.3 & Modern AEAD Ciphers
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chennaiguardian.in www.chennaiguardian.in;

    # Remove server banner (POC-14)
    server_tokens off;

    # SSL Certificates (Managed by Let's Encrypt / Government CA)
    ssl_certificate /etc/letsencrypt/live/chennaiguardian.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chennaiguardian.in/privkey.pem;

    # ── TLS PROTOCOL HARDENING (POC-07, POC-08) ──
    # Explicitly permit ONLY TLS 1.2 and TLS 1.3. Disallow TLS 1.0, TLS 1.1, SSLv3.
    ssl_protocols TLSv1.2 TLSv1.3;

    # ── CIPHER SUITE HARDENING (POC-08, POC-09, POC-11) ──
    # Restrict strictly to modern Authenticated Encryption with Associated Data (AEAD) ciphers.
    # Excludes 3DES, DES, RC4, MD5, and ALL vulnerable CBC-mode cipher suites (Lucky13 / BEAST).
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # ── TLS SESSION & PERFORMANCE OPTIMIZATION ──
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ── OCSP STAPLING ──
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/chennaiguardian.in/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── SECURITY HEADERS (POC-10, POC-12, POC-14) ──
    # HTTP Strict Transport Security (HSTS) - 2 Years with SubDomains & Preload
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # MIME Type Sniffing Prevention
    add_header X-Content-Type-Options "nosniff" always;

    # Clickjacking Protection
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Browser Feature Restrictions
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Hide Upstream Framework Headers (POC-14)
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Maximum upload file size (250MB for video evidence)
    client_max_body_size 250M;

    # ── APPLICATION PROXY CONFIGURATION ──
    location / {
        limit_req zone=gcp_general_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Strict Rate Limiting for Auth Endpoint
    location /api/admin/auth {
        limit_req zone=gcp_auth_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Strict Rate Limiting for Email & Grievance Endpoints
    location ~* ^/api/(send-email|feedback|contact-us) {
        limit_req zone=gcp_email_limit burst=3 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static Assets Caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploads directory
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline";
    }
}
