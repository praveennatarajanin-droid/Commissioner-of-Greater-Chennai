# ==============================================================================
# GREATER CHENNAI POLICE COMMISSIONER PORTAL ("CHENNAI GUARDIAN")
# KUBERNETES INGRESS HARDENED TLS CONFIGURATION
# Remediates: POC-07 (Deprecated TLS 1.0/1.1 Protocols Identified)
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chennai-guardian-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # ── TLS PROTOCOL HARDENING (POC-07) ──
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    # ── CIPHER SUITE HARDENING (POC-08, POC-11) ──
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
    nginx.ingress.kubernetes.io/ssl-prefer-server-ciphers: "false"
    # ── HSTS & SECURITY HEADERS (POC-10, POC-12) ──
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "63072000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "250m"
spec:
  tls:
    - hosts:
        - chennaiguardian.mccmrfip.in
        - chennaiguardian.in
        - www.chennaiguardian.in
      secretName: chennaiguardian-tls-cert
  rules:
    - host: chennaiguardian.mccmrfip.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chennai-guardian-svc
                port:
                  number: 3000
